<!DOCTYPE html>
<html lang="pt - BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 CSS Embutido</title>
    <style>
        em {
            color: purple;
            text-decoration: underline;
        }

        code {
            color: plum;
            text-decoration: underline;
        }

        li>code {
            color: rgb(124, 92, 197);
            background-color: rgb(167, 225, 233);
        }
    </style>
</head>

<body>
    <main>
        <h1> DCC202 CSS Embutido </h1>
        <p> O estilo <em> embutido </em>
            é aplicado diretamente no elemento via atríbuto
            <code>style</code>.
        </p>
        <ol>
            <li><code> Hello guys </code></li>
            <li><code>2+2=4</code></li>
        </ol>


    </main>
</body>

</html>
